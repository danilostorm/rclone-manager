name: Publish unified Rclone Manager release

on:
  push:
    branches: [main]
    paths:
      - 'release-bundle/VERSION'
      - 'release-bundle/assets/**'
      - 'extension-release/VERSION'
      - 'unraid-release/VERSION'
      - 'desktop-release/VERSION'
      - 'vps-release/VERSION'
      - 'docs/RELEASE-RCLONE-MANAGER-*.md'
      - '.github/workflows/publish-unified-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and validate release assets
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="$(tr -d '[:space:]' < release-bundle/VERSION)"
          UNRAID="$(tr -d '[:space:]' < unraid-release/VERSION)"
          ZORIN="$(tr -d '[:space:]' < desktop-release/VERSION)"
          VPS="$(tr -d '[:space:]' < vps-release/VERSION)"
          EXT="$(tr -d '[:space:]' < extension-release/VERSION)"

          test "$BUNDLE" = '1.7.8'
          test "$UNRAID" = '1.7.8'
          test "$ZORIN" = '1.3.8'
          test "$VPS" = '1.0.9'
          test "$EXT" = '1.2.3'

          SRC="release-bundle/assets/${BUNDLE}"
          OUT="dist-unified"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          rebuild() {
            local name="$1"
            local prefix="$SRC/${name}.b64.part-"
            test -e "${prefix}00"
            cat "${prefix}"* | base64 -d > "$OUT/$name"
          }

          rebuild "rclone-manager-unraid-v${UNRAID}.zip"
          rebuild "rclone-manager-desktop-zorinos-v${ZORIN}.zip"
          rebuild "rclone-manager-desktop-zorinos_${ZORIN}_all.deb"
          rebuild "rclone-manager-vps-v${VPS}.zip"
          rebuild "rclone-manager-vps-v${VPS}.tar.gz"
          rebuild "rclone-manager-drive-link-copier-v${EXT}.zip"
          rebuild "SHA256SUMS.txt"

          # Integridade dos formatos.
          unzip -t "$OUT/rclone-manager-unraid-v${UNRAID}.zip" >/dev/null
          unzip -t "$OUT/rclone-manager-desktop-zorinos-v${ZORIN}.zip" >/dev/null
          unzip -t "$OUT/rclone-manager-vps-v${VPS}.zip" >/dev/null
          unzip -t "$OUT/rclone-manager-drive-link-copier-v${EXT}.zip" >/dev/null
          tar -tzf "$OUT/rclone-manager-vps-v${VPS}.tar.gz" >/dev/null
          dpkg-deb --info "$OUT/rclone-manager-desktop-zorinos_${ZORIN}_all.deb" >/dev/null

          # Versões internas.
          test "$(unzip -p "$OUT/rclone-manager-unraid-v${UNRAID}.zip" VERSION | tr -d '[:space:]')" = "$UNRAID"
          test "$(unzip -p "$OUT/rclone-manager-desktop-zorinos-v${ZORIN}.zip" '*/VERSION' | tr -d '[:space:]')" = "$ZORIN"
          test "$(unzip -p "$OUT/rclone-manager-vps-v${VPS}.zip" '*/VERSION' | tr -d '[:space:]')" = "$VPS"
          unzip -p "$OUT/rclone-manager-drive-link-copier-v${EXT}.zip" '*/manifest.json' | grep -Eq '"version"[[:space:]]*:[[:space:]]*"1\.2\.3"'

          # Metadados VPS devem acompanhar a versão real.
          unzip -p "$OUT/rclone-manager-vps-v${VPS}.zip" '*/install.sh' | grep -F 'VERSION="1.0.9"'
          unzip -p "$OUT/rclone-manager-vps-v${VPS}.zip" '*/docker-compose.yml' | grep -F 'local/rclone-manager-vps:1.0.9'
          unzip -p "$OUT/rclone-manager-vps-v${VPS}.zip" '*/Dockerfile' | grep -F 'org.opencontainers.image.version="1.0.9"'

          # Checksum oficial da release.
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)

          ls -lh "$OUT"

      - name: Create or update one unified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(tr -d '[:space:]' < release-bundle/VERSION)"
          UNRAID="$(tr -d '[:space:]' < unraid-release/VERSION)"
          ZORIN="$(tr -d '[:space:]' < desktop-release/VERSION)"
          VPS="$(tr -d '[:space:]' < vps-release/VERSION)"
          EXT="$(tr -d '[:space:]' < extension-release/VERSION)"
          TAG="rclone-manager-v${BUNDLE}"
          TITLE="Rclone Manager v${BUNDLE} — Unraid, ZorinOS, VPS + Extensão"
          NOTES="docs/RELEASE-RCLONE-MANAGER-${BUNDLE}.md"
          ASSETS=(
            "dist-unified/rclone-manager-unraid-v${UNRAID}.zip"
            "dist-unified/rclone-manager-desktop-zorinos-v${ZORIN}.zip"
            "dist-unified/rclone-manager-desktop-zorinos_${ZORIN}_all.deb"
            "dist-unified/rclone-manager-vps-v${VPS}.zip"
            "dist-unified/rclone-manager-vps-v${VPS}.tar.gz"
            "dist-unified/rclone-manager-drive-link-copier-v${EXT}.zip"
            "dist-unified/SHA256SUMS.txt"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TITLE" --notes-file "$NOTES" --latest
          fi
