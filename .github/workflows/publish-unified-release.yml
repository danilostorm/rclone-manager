name: Publish unified Rclone Manager release

on:
  push:
    branches: [main]
    paths:
      - 'release-bundle/VERSION'
      - 'release-bundle/source-full/**'
      - 'extension-release/VERSION'
      - 'unraid-release/VERSION'
      - 'desktop-release/VERSION'
      - 'vps-release/VERSION'
      - 'docs/RELEASE-RCLONE-MANAGER-1.9.0.md'
      - '.github/workflows/publish-unified-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils patch zip unzip dpkg-dev

      - name: Download and verify stable bases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rclone-bases
          gh release download rclone-manager-v1.7.8 \
            --pattern 'rclone-manager-unraid-v1.7.8.zip' \
            --pattern 'rclone-manager-desktop-zorinos-v1.3.8.zip' \
            --pattern 'rclone-manager-vps-v1.0.9.zip' \
            --pattern 'rclone-manager-drive-link-copier-v1.2.3.zip' \
            --dir /tmp/rclone-bases
          (cd /tmp/rclone-bases && sha256sum -c "$GITHUB_WORKSPACE/release-bundle/source-full/BASE-1.7.8-SHA256SUMS.txt")

      - name: Rebuild validated 1.9.0 source trees
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="$(tr -d '[:space:]' < release-bundle/VERSION)"
          UNRAID="$(tr -d '[:space:]' < unraid-release/VERSION)"
          ZORIN="$(tr -d '[:space:]' < desktop-release/VERSION)"
          VPS="$(tr -d '[:space:]' < vps-release/VERSION)"
          EXT="$(tr -d '[:space:]' < extension-release/VERSION)"

          test "$BUNDLE" = '1.9.0'
          test "$UNRAID" = '1.9.0'
          test "$ZORIN" = '1.5.0'
          test "$VPS" = '1.2.0'
          test "$EXT" = '1.3.0'

          rm -rf build-unraid build-zorin build-vps build-ext package dist-unified /tmp/final-patches /tmp/base-unpack
          mkdir -p build-unraid build-zorin build-vps build-ext dist-unified /tmp/final-patches /tmp/base-unpack/desktop /tmp/base-unpack/vps /tmp/base-unpack/ext

          # Unpack the four pinned stable bases.
          unzip -q /tmp/rclone-bases/rclone-manager-unraid-v1.7.8.zip -d build-unraid
          unzip -q /tmp/rclone-bases/rclone-manager-desktop-zorinos-v1.3.8.zip -d /tmp/base-unpack/desktop
          unzip -q /tmp/rclone-bases/rclone-manager-vps-v1.0.9.zip -d /tmp/base-unpack/vps
          unzip -q /tmp/rclone-bases/rclone-manager-drive-link-copier-v1.2.3.zip -d /tmp/base-unpack/ext

          DBASE="$(find /tmp/base-unpack/desktop -mindepth 1 -maxdepth 1 -type d | head -n1)"
          VBASE="$(find /tmp/base-unpack/vps -mindepth 1 -maxdepth 1 -type d | head -n1)"
          EBASE="$(find /tmp/base-unpack/ext -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$DBASE" && test -n "$VBASE" && test -n "$EBASE"

          ZSRC="build-zorin/rclone-manager-desktop-v${ZORIN}"
          VSRC="build-vps/rclone-manager-vps-v${VPS}"
          EXTROOT="build-ext/rclone-manager-drive-link-copier-v${EXT}"
          mv "$DBASE" "$ZSRC"
          mv "$VBASE" "$VSRC"
          mv "$EBASE" "$EXTROOT"

          test "$(tr -d '[:space:]' < build-unraid/VERSION)" = '1.7.8'
          test "$(tr -d '[:space:]' < "$ZSRC/VERSION")" = '1.3.8'
          test "$(tr -d '[:space:]' < "$VSRC/VERSION")" = '1.0.9'
          grep -Eq '"version"[[:space:]]*:[[:space:]]*"1\.2\.3"' "$EXTROOT/manifest.json"

          # Reconstitute and verify the exact final source delta.
          cat release-bundle/source-full/final-1.9.0-patches-small.b64.part-* | base64 -d > /tmp/final-1.9.0-patches.tar.xz
          echo '8fcec580b4f5cbecc30120cd396f70af23931a2b91f9a490384a85e0a3b73a74  /tmp/final-1.9.0-patches.tar.xz' | sha256sum -c -
          tar -xJf /tmp/final-1.9.0-patches.tar.xz -C /tmp/final-patches

          patch -d build-unraid -p1 --batch < /tmp/final-patches/unraid-1.7.8-to-1.9.0.patch
          patch -d "$ZSRC" -p1 --batch < /tmp/final-patches/desktop-1.3.8-to-1.5.0.patch
          patch -d "$VSRC" -p1 --batch < /tmp/final-patches/vps-1.0.9-to-1.2.0.patch
          patch -d "$EXTROOT" -p1 --batch < /tmp/final-patches/extension-1.2.3-to-1.3.0.patch

          # Validate final versions.
          test "$(tr -d '[:space:]' < build-unraid/VERSION)" = "$UNRAID"
          test "$(tr -d '[:space:]' < "$ZSRC/VERSION")" = "$ZORIN"
          test "$(tr -d '[:space:]' < "$VSRC/VERSION")" = "$VPS"
          grep -Eq '"version"[[:space:]]*:[[:space:]]*"1\.3\.0"' "$EXTROOT/manifest.json"

          # Refuse persistent or secret runtime files.
          for SRC in build-unraid "$ZSRC" "$VSRC" "$EXTROOT"; do
            if find "$SRC" -type f \( -name '.env' -o -name 'rclone.conf' -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.pem' -o -name '*.key' \) | grep -q .; then
              echo "Sensitive runtime file found in $SRC" >&2
              exit 1
            fi
            if find "$SRC" -type d -name '__pycache__' | grep -q .; then
              echo "__pycache__ found in $SRC" >&2
              exit 1
            fi
          done

          python3 - <<'PY'
          import pathlib, py_compile, tempfile
          roots = [pathlib.Path('build-unraid')]
          roots += list(pathlib.Path('build-zorin').iterdir())
          roots += list(pathlib.Path('build-vps').iterdir())
          for root in roots:
              for p in root.rglob('*.py'):
                  with tempfile.NamedTemporaryFile(suffix='.pyc') as f:
                      py_compile.compile(str(p), doraise=True, cfile=f.name)
          print('Python syntax OK')
          PY

          grep -F 'VERSION="1.2.0"' "$VSRC/install.sh"
          grep -F 'local/rclone-manager-vps:1.2.0' "$VSRC/docker-compose.yml"
          grep -F 'org.opencontainers.image.version="1.2.0"' "$VSRC/Dockerfile"

      - name: Package all editions
        shell: bash
        run: |
          set -euo pipefail
          UNRAID="$(tr -d '[:space:]' < unraid-release/VERSION)"
          ZORIN="$(tr -d '[:space:]' < desktop-release/VERSION)"
          VPS="$(tr -d '[:space:]' < vps-release/VERSION)"
          EXT="$(tr -d '[:space:]' < extension-release/VERSION)"
          ZSRC="build-zorin/rclone-manager-desktop-v${ZORIN}"

          (cd build-unraid && zip -qr "$GITHUB_WORKSPACE/dist-unified/rclone-manager-unraid-v${UNRAID}.zip" .)
          (cd build-zorin && zip -qr "$GITHUB_WORKSPACE/dist-unified/rclone-manager-desktop-zorinos-v${ZORIN}.zip" "rclone-manager-desktop-v${ZORIN}")
          (cd build-vps && zip -qr "$GITHUB_WORKSPACE/dist-unified/rclone-manager-vps-v${VPS}.zip" "rclone-manager-vps-v${VPS}")
          tar -czf "dist-unified/rclone-manager-vps-v${VPS}.tar.gz" -C build-vps "rclone-manager-vps-v${VPS}"
          (cd build-ext && zip -qr "$GITHUB_WORKSPACE/dist-unified/rclone-manager-drive-link-copier-v${EXT}.zip" "rclone-manager-drive-link-copier-v${EXT}")

          PKG=package
          DEB="$GITHUB_WORKSPACE/dist-unified/rclone-manager-desktop-zorinos_${ZORIN}_all.deb"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/rclone-manager-desktop" "$PKG/usr/bin" "$PKG/usr/share/applications"
          cp -a "$ZSRC"/. "$PKG/opt/rclone-manager-desktop/"
          cp "$ZSRC/packaging/rclone-manager-desktop" "$PKG/usr/bin/rclone-manager-desktop"
          cp "$ZSRC/packaging/rclone-manager-desktop.desktop" "$PKG/usr/share/applications/rclone-manager-desktop.desktop"
          chmod +x "$PKG/usr/bin/rclone-manager-desktop" "$PKG/opt/rclone-manager-desktop/desktop_main.py" "$PKG/opt/rclone-manager-desktop/install-zorin.sh" "$PKG/opt/rclone-manager-desktop/uninstall-zorin.sh"
          cat > "$PKG/DEBIAN/control" <<CONTROL
          Package: rclone-manager-desktop
          Version: ${ZORIN}
          Section: net
          Priority: optional
          Architecture: all
          Maintainer: Storm Projects
          Depends: python3, python3-flask, python3-requests, python3-waitress, python3-gi, gir1.2-gtk-3.0, gir1.2-webkit2-4.1, rclone, fuse3, ca-certificates
          Description: Rclone Manager Desktop for ZorinOS
           Google Drive multi-account manager, Media Pool, OneDrive/link importer, backup/restore and Drive Link API.
          CONTROL
          cat > "$PKG/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          chmod +x /opt/rclone-manager-desktop/desktop_main.py || true
          update-desktop-database /usr/share/applications >/dev/null 2>&1 || true
          exit 0
          POSTINST
          cat > "$PKG/DEBIAN/prerm" <<'PRERM'
          #!/bin/sh
          pkill -f '/opt/rclone-manager-desktop/desktop_main.py' 2>/dev/null || true
          exit 0
          PRERM
          chmod 755 "$PKG/DEBIAN/postinst" "$PKG/DEBIAN/prerm"
          dpkg-deb --build --root-owner-group "$PKG" "$DEB"

          unzip -t "dist-unified/rclone-manager-unraid-v${UNRAID}.zip" >/dev/null
          unzip -t "dist-unified/rclone-manager-desktop-zorinos-v${ZORIN}.zip" >/dev/null
          unzip -t "dist-unified/rclone-manager-vps-v${VPS}.zip" >/dev/null
          unzip -t "dist-unified/rclone-manager-drive-link-copier-v${EXT}.zip" >/dev/null
          tar -tzf "dist-unified/rclone-manager-vps-v${VPS}.tar.gz" >/dev/null
          dpkg-deb --info "$DEB" >/dev/null

          (
            cd dist-unified
            sha256sum \
              "rclone-manager-unraid-v${UNRAID}.zip" \
              "rclone-manager-desktop-zorinos-v${ZORIN}.zip" \
              "rclone-manager-desktop-zorinos_${ZORIN}_all.deb" \
              "rclone-manager-vps-v${VPS}.zip" \
              "rclone-manager-vps-v${VPS}.tar.gz" \
              "rclone-manager-drive-link-copier-v${EXT}.zip" \
              > SHA256SUMS.txt
          )
          cat dist-unified/SHA256SUMS.txt

      - name: Publish unified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(tr -d '[:space:]' < release-bundle/VERSION)"
          UNRAID="$(tr -d '[:space:]' < unraid-release/VERSION)"
          ZORIN="$(tr -d '[:space:]' < desktop-release/VERSION)"
          VPS="$(tr -d '[:space:]' < vps-release/VERSION)"
          EXT="$(tr -d '[:space:]' < extension-release/VERSION)"
          TAG="rclone-manager-v${BUNDLE}"
          TITLE="Rclone Manager v${BUNDLE} — Media Pool + Google Advanced"
          NOTES="docs/RELEASE-RCLONE-MANAGER-${BUNDLE}.md"
          ASSETS=(
            "dist-unified/rclone-manager-unraid-v${UNRAID}.zip"
            "dist-unified/rclone-manager-desktop-zorinos-v${ZORIN}.zip"
            "dist-unified/rclone-manager-desktop-zorinos_${ZORIN}_all.deb"
            "dist-unified/rclone-manager-vps-v${VPS}.zip"
            "dist-unified/rclone-manager-vps-v${VPS}.tar.gz"
            "dist-unified/rclone-manager-drive-link-copier-v${EXT}.zip"
            "dist-unified/SHA256SUMS.txt"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --latest
          fi

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(tr -d '[:space:]' < release-bundle/VERSION)"
          UNRAID="$(tr -d '[:space:]' < unraid-release/VERSION)"
          ZORIN="$(tr -d '[:space:]' < desktop-release/VERSION)"
          VPS="$(tr -d '[:space:]' < vps-release/VERSION)"
          EXT="$(tr -d '[:space:]' < extension-release/VERSION)"
          TAG="rclone-manager-v${BUNDLE}"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/release-assets.txt
          for NAME in \
            "rclone-manager-unraid-v${UNRAID}.zip" \
            "rclone-manager-desktop-zorinos-v${ZORIN}.zip" \
            "rclone-manager-desktop-zorinos_${ZORIN}_all.deb" \
            "rclone-manager-vps-v${VPS}.zip" \
            "rclone-manager-vps-v${VPS}.tar.gz" \
            "rclone-manager-drive-link-copier-v${EXT}.zip" \
            "SHA256SUMS.txt"; do
            grep -Fxq "$NAME" /tmp/release-assets.txt || { echo "Missing release asset: $NAME" >&2; exit 1; }
          done
          echo "Release $TAG verified with all expected assets."
