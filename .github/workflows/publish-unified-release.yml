name: Publish unified Rclone Manager release

on:
  push:
    branches: [main]
    paths:
      - 'release-bundle/VERSION'
      - 'release-bundle/source/**'
      - 'extension-release/VERSION'
      - 'unraid-release/VERSION'
      - 'desktop-release/VERSION'
      - 'vps-release/VERSION'
      - 'docs/RELEASE-RCLONE-MANAGER-*.md'
      - '.github/workflows/publish-unified-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils patch zip unzip dpkg-dev

      - name: Build all release artifacts
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="$(tr -d '[:space:]' < release-bundle/VERSION)"
          UNRAID="$(tr -d '[:space:]' < unraid-release/VERSION)"
          ZORIN="$(tr -d '[:space:]' < desktop-release/VERSION)"
          VPS="$(tr -d '[:space:]' < vps-release/VERSION)"
          EXT="$(tr -d '[:space:]' < extension-release/VERSION)"

          test "$BUNDLE" = '1.7.2'
          test "$UNRAID" = '1.7.2'
          test "$ZORIN" = '1.3.2'
          test "$VPS" = '1.0.3'
          test "$EXT" = '1.0.1'

          BASE_PREFIX='unraid-release/full/1.6.9.tar.xz.b64.part-'
          U170='unraid-release/patches/1.7.0.patch.xz.b64'
          D130_PREFIX='desktop-release/patches/from-unraid-1.7.0-to-1.3.0.patch.xz.b64.part-'
          V101='vps-release/patches/from-unraid-1.7.0-to-1.0.1.patch.xz.b64'
          U172_PREFIX='release-bundle/source/unraid-1.7.0-to-1.7.2.patch.xz.b64.part-'
          Z132_PREFIX='release-bundle/source/zorin-1.3.0-to-1.3.2.patch.xz.b64.part-'
          V103_PREFIX='release-bundle/source/vps-1.0.1-to-1.0.3.patch.xz.b64.part-'
          EXT_PREFIX='release-bundle/source/extension-1.0.1.zip.b64.part-'

          test -e "${BASE_PREFIX}00"
          test -f "$U170"
          test -e "${D130_PREFIX}00"
          test -f "$V101"
          test -e "${U172_PREFIX}00"
          test -e "${Z132_PREFIX}00"
          test -e "${V103_PREFIX}00"
          test -e "${EXT_PREFIX}00"

          rm -rf build-base170 build-unraid build-zorin build-vps package dist-unified
          mkdir -p build-base170 build-unraid build-zorin build-vps dist-unified

          # Base validada Unraid 1.7.0
          cat "${BASE_PREFIX}"* | base64 -d > /tmp/base-unraid-1.6.9.tar.xz
          tar -xJf /tmp/base-unraid-1.6.9.tar.xz -C build-base170
          base64 -d "$U170" | xz -d > /tmp/unraid-1.7.0.patch
          patch -d build-base170 -p1 < /tmp/unraid-1.7.0.patch
          test "$(tr -d '[:space:]' < build-base170/VERSION)" = '1.7.0'

          # Unraid 1.7.2
          cp -a build-base170/. build-unraid/
          cat "${U172_PREFIX}"* | base64 -d | xz -d > /tmp/unraid-1.7.2.patch
          patch -d build-unraid -p1 < /tmp/unraid-1.7.2.patch
          test "$(tr -d '[:space:]' < build-unraid/VERSION)" = "$UNRAID"

          # ZorinOS 1.3.2
          ZSRC="build-zorin/rclone-manager-desktop-v${ZORIN}"
          cp -a build-base170 "$ZSRC"
          cat "${D130_PREFIX}"* | base64 -d | xz -d > /tmp/zorin-1.3.0.patch
          patch -d "$ZSRC" -p1 < /tmp/zorin-1.3.0.patch
          cat "${Z132_PREFIX}"* | base64 -d | xz -d > /tmp/zorin-1.3.2.patch
          patch -d "$ZSRC" -p1 < /tmp/zorin-1.3.2.patch
          test "$(tr -d '[:space:]' < "$ZSRC/VERSION")" = "$ZORIN"

          # VPS 1.0.3
          VSRC="build-vps/rclone-manager-vps-v${VPS}"
          cp -a build-base170 "$VSRC"
          base64 -d "$V101" | xz -d > /tmp/vps-1.0.1.patch
          patch -d "$VSRC" -p1 < /tmp/vps-1.0.1.patch
          cat "${V103_PREFIX}"* | base64 -d | xz -d > /tmp/vps-1.0.3.patch
          patch -d "$VSRC" -p1 < /tmp/vps-1.0.3.patch
          test "$(tr -d '[:space:]' < "$VSRC/VERSION")" = "$VPS"

          # Segurança: nenhum runtime secreto pode entrar nos pacotes.
          for SRC in build-unraid "$ZSRC" "$VSRC"; do
            if find "$SRC" -type f \( -name '.env' -o -name 'rclone.conf' -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.pem' -o -name '*.key' \) | grep -q .; then
              echo "Sensitive runtime file found in $SRC" >&2
              exit 1
            fi
            if find "$SRC" -type d -name '__pycache__' | grep -q .; then
              echo "__pycache__ found in $SRC" >&2
              exit 1
            fi
          done

          # Pacote Unraid
          (cd build-unraid && zip -qr "$GITHUB_WORKSPACE/dist-unified/rclone-manager-unraid-v${UNRAID}.zip" .)

          # Pacote ZorinOS ZIP
          (cd build-zorin && zip -qr "$GITHUB_WORKSPACE/dist-unified/rclone-manager-desktop-zorinos-v${ZORIN}.zip" "rclone-manager-desktop-v${ZORIN}")

          # Pacote ZorinOS DEB
          PKG=package
          DEB="$GITHUB_WORKSPACE/dist-unified/rclone-manager-desktop-zorinos_${ZORIN}_all.deb"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/rclone-manager-desktop" "$PKG/usr/bin" "$PKG/usr/share/applications"
          cp -a "$ZSRC"/. "$PKG/opt/rclone-manager-desktop/"
          cp "$ZSRC/packaging/rclone-manager-desktop" "$PKG/usr/bin/rclone-manager-desktop"
          cp "$ZSRC/packaging/rclone-manager-desktop.desktop" "$PKG/usr/share/applications/rclone-manager-desktop.desktop"
          chmod +x "$PKG/usr/bin/rclone-manager-desktop" "$PKG/opt/rclone-manager-desktop/desktop_main.py" "$PKG/opt/rclone-manager-desktop/install-zorin.sh" "$PKG/opt/rclone-manager-desktop/uninstall-zorin.sh"
          cat > "$PKG/DEBIAN/control" <<CONTROL
          Package: rclone-manager-desktop
          Version: ${ZORIN}
          Section: net
          Priority: optional
          Architecture: all
          Maintainer: Storm Projects
          Depends: python3, python3-flask, python3-requests, python3-waitress, python3-gi, gir1.2-gtk-3.0, gir1.2-webkit2-4.1, rclone, fuse3, ca-certificates
          Description: Rclone Manager Desktop for ZorinOS
           Google Drive multi-account manager, OneDrive importer, portable backup/restore and Drive Link Copier API.
          CONTROL
          cat > "$PKG/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          chmod +x /opt/rclone-manager-desktop/desktop_main.py || true
          update-desktop-database /usr/share/applications >/dev/null 2>&1 || true
          exit 0
          POSTINST
          cat > "$PKG/DEBIAN/prerm" <<'PRERM'
          #!/bin/sh
          pkill -f '/opt/rclone-manager-desktop/desktop_main.py' 2>/dev/null || true
          exit 0
          PRERM
          chmod 755 "$PKG/DEBIAN/postinst" "$PKG/DEBIAN/prerm"
          dpkg-deb --build --root-owner-group "$PKG" "$DEB"

          # Pacotes VPS ZIP + TAR.GZ
          (cd build-vps && zip -qr "$GITHUB_WORKSPACE/dist-unified/rclone-manager-vps-v${VPS}.zip" "rclone-manager-vps-v${VPS}")
          tar -czf "dist-unified/rclone-manager-vps-v${VPS}.tar.gz" -C build-vps "rclone-manager-vps-v${VPS}"

          # Extensão Chrome/Chromium
          cat "${EXT_PREFIX}"* | base64 -d > "dist-unified/rclone-manager-drive-link-copier-v${EXT}.zip"
          unzip -t "dist-unified/rclone-manager-drive-link-copier-v${EXT}.zip"
          unzip -p "dist-unified/rclone-manager-drive-link-copier-v${EXT}.zip" '*/manifest.json' | grep -Eq '"version"[[:space:]]*:[[:space:]]*"1\.0\.1"'

          # Checksums de todos os downloads da release unificada.
          (
            cd dist-unified
            sha256sum \
              "rclone-manager-unraid-v${UNRAID}.zip" \
              "rclone-manager-desktop-zorinos-v${ZORIN}.zip" \
              "rclone-manager-desktop-zorinos_${ZORIN}_all.deb" \
              "rclone-manager-vps-v${VPS}.zip" \
              "rclone-manager-vps-v${VPS}.tar.gz" \
              "rclone-manager-drive-link-copier-v${EXT}.zip" \
              > SHA256SUMS.txt
          )

          ls -lh dist-unified
          cat dist-unified/SHA256SUMS.txt

      - name: Create or update one unified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(tr -d '[:space:]' < release-bundle/VERSION)"
          UNRAID="$(tr -d '[:space:]' < unraid-release/VERSION)"
          ZORIN="$(tr -d '[:space:]' < desktop-release/VERSION)"
          VPS="$(tr -d '[:space:]' < vps-release/VERSION)"
          EXT="$(tr -d '[:space:]' < extension-release/VERSION)"
          TAG="rclone-manager-v${BUNDLE}"
          TITLE="Rclone Manager v${BUNDLE} — Unraid, ZorinOS, VPS + Extensão"
          NOTES="docs/RELEASE-RCLONE-MANAGER-${BUNDLE}.md"
          ASSETS=(
            "dist-unified/rclone-manager-unraid-v${UNRAID}.zip"
            "dist-unified/rclone-manager-desktop-zorinos-v${ZORIN}.zip"
            "dist-unified/rclone-manager-desktop-zorinos_${ZORIN}_all.deb"
            "dist-unified/rclone-manager-vps-v${VPS}.zip"
            "dist-unified/rclone-manager-vps-v${VPS}.tar.gz"
            "dist-unified/rclone-manager-drive-link-copier-v${EXT}.zip"
            "dist-unified/SHA256SUMS.txt"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TITLE" --notes-file "$NOTES" --latest
          fi
