name: Publish unified Rclone Manager release

on:
  push:
    branches: [main]
    paths:
      - 'release-bundle/VERSION'
      - 'release-bundle/source-full/**'
      - 'extension-release/VERSION'
      - 'unraid-release/VERSION'
      - 'desktop-release/VERSION'
      - 'vps-release/VERSION'
      - 'docs/RELEASE-RCLONE-MANAGER-1.9.0.md'
      - '.github/workflows/publish-unified-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils zip unzip dpkg-dev

      - name: Rebuild source snapshots and validate
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="$(tr -d '[:space:]' < release-bundle/VERSION)"
          UNRAID="$(tr -d '[:space:]' < unraid-release/VERSION)"
          ZORIN="$(tr -d '[:space:]' < desktop-release/VERSION)"
          VPS="$(tr -d '[:space:]' < vps-release/VERSION)"
          EXT="$(tr -d '[:space:]' < extension-release/VERSION)"

          test "$BUNDLE" = '1.9.0'
          test "$UNRAID" = '1.9.0'
          test "$ZORIN" = '1.5.0'
          test "$VPS" = '1.2.0'
          test "$EXT" = '1.3.0'

          SRC='release-bundle/source-full'
          rm -rf build dist-unified package /tmp/rclone-source
          mkdir -p build/unraid build/desktop build/vps build/ext dist-unified /tmp/rclone-source

          cat "$SRC/unraid-${UNRAID}.tar.xz.b64.part-"* | base64 -d > "/tmp/rclone-source/unraid-${UNRAID}.tar.xz"
          cat "$SRC/desktop-${ZORIN}.tar.xz.b64.part-"* | base64 -d > "/tmp/rclone-source/desktop-${ZORIN}.tar.xz"
          cat "$SRC/vps-${VPS}.tar.xz.b64.part-"* | base64 -d > "/tmp/rclone-source/vps-${VPS}.tar.xz"
          cat "$SRC/drive-link-copier-${EXT}.tar.xz.b64.part-"* | base64 -d > "/tmp/rclone-source/drive-link-copier-${EXT}.tar.xz"

          (cd /tmp/rclone-source && sha256sum -c "$GITHUB_WORKSPACE/$SRC/SHA256SUMS-SOURCE.txt")

          tar -xJf "/tmp/rclone-source/unraid-${UNRAID}.tar.xz" -C build/unraid
          tar -xJf "/tmp/rclone-source/desktop-${ZORIN}.tar.xz" -C build/desktop
          tar -xJf "/tmp/rclone-source/vps-${VPS}.tar.xz" -C build/vps
          tar -xJf "/tmp/rclone-source/drive-link-copier-${EXT}.tar.xz" -C build/ext

          test "$(tr -d '[:space:]' < build/unraid/VERSION)" = "$UNRAID"
          test "$(tr -d '[:space:]' < build/desktop/VERSION)" = "$ZORIN"
          test "$(tr -d '[:space:]' < build/vps/VERSION)" = "$VPS"
          grep -Eq '"version"[[:space:]]*:[[:space:]]*"1\.3\.0"' build/ext/manifest.json

          for TREE in build/unraid build/desktop build/vps build/ext; do
            if find "$TREE" -type f \( -name '.env' -o -name 'rclone.conf' -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.pem' -o -name '*.key' \) | grep -q .; then
              echo "Sensitive runtime file found in $TREE" >&2
              exit 1
            fi
            if find "$TREE" -type d -name '__pycache__' | grep -q .; then
              echo "__pycache__ found in $TREE" >&2
              exit 1
            fi
          done

          python3 - <<'PY'
          import pathlib, py_compile, tempfile
          for root in ('build/unraid', 'build/desktop', 'build/vps'):
              for p in pathlib.Path(root).rglob('*.py'):
                  with tempfile.NamedTemporaryFile(suffix='.pyc') as f:
                      py_compile.compile(str(p), doraise=True, cfile=f.name)
          print('Python syntax OK')
          PY

          grep -F 'VERSION="1.2.0"' build/vps/install.sh
          grep -F 'local/rclone-manager-vps:1.2.0' build/vps/docker-compose.yml
          grep -F 'org.opencontainers.image.version="1.2.0"' build/vps/Dockerfile

      - name: Package all editions
        shell: bash
        run: |
          set -euo pipefail
          UNRAID="$(tr -d '[:space:]' < unraid-release/VERSION)"
          ZORIN="$(tr -d '[:space:]' < desktop-release/VERSION)"
          VPS="$(tr -d '[:space:]' < vps-release/VERSION)"
          EXT="$(tr -d '[:space:]' < extension-release/VERSION)"

          (cd build/unraid && zip -qr "$GITHUB_WORKSPACE/dist-unified/rclone-manager-unraid-v${UNRAID}.zip" .)

          mkdir -p "build/package-desktop/rclone-manager-desktop-v${ZORIN}"
          cp -a build/desktop/. "build/package-desktop/rclone-manager-desktop-v${ZORIN}/"
          (cd build/package-desktop && zip -qr "$GITHUB_WORKSPACE/dist-unified/rclone-manager-desktop-zorinos-v${ZORIN}.zip" "rclone-manager-desktop-v${ZORIN}")

          mkdir -p "build/package-vps/rclone-manager-vps-v${VPS}"
          cp -a build/vps/. "build/package-vps/rclone-manager-vps-v${VPS}/"
          (cd build/package-vps && zip -qr "$GITHUB_WORKSPACE/dist-unified/rclone-manager-vps-v${VPS}.zip" "rclone-manager-vps-v${VPS}")
          tar -czf "dist-unified/rclone-manager-vps-v${VPS}.tar.gz" -C build/package-vps "rclone-manager-vps-v${VPS}"

          mkdir -p "build/package-ext/rclone-manager-drive-link-copier-v${EXT}"
          cp -a build/ext/. "build/package-ext/rclone-manager-drive-link-copier-v${EXT}/"
          (cd build/package-ext && zip -qr "$GITHUB_WORKSPACE/dist-unified/rclone-manager-drive-link-copier-v${EXT}.zip" "rclone-manager-drive-link-copier-v${EXT}")

          PKG=package
          DEB="$GITHUB_WORKSPACE/dist-unified/rclone-manager-desktop-zorinos_${ZORIN}_all.deb"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/rclone-manager-desktop" "$PKG/usr/bin" "$PKG/usr/share/applications"
          cp -a build/desktop/. "$PKG/opt/rclone-manager-desktop/"
          cp build/desktop/packaging/rclone-manager-desktop "$PKG/usr/bin/rclone-manager-desktop"
          cp build/desktop/packaging/rclone-manager-desktop.desktop "$PKG/usr/share/applications/rclone-manager-desktop.desktop"
          chmod +x "$PKG/usr/bin/rclone-manager-desktop" "$PKG/opt/rclone-manager-desktop/desktop_main.py" "$PKG/opt/rclone-manager-desktop/install-zorin.sh" "$PKG/opt/rclone-manager-desktop/uninstall-zorin.sh"
          cat > "$PKG/DEBIAN/control" <<CONTROL
          Package: rclone-manager-desktop
          Version: ${ZORIN}
          Section: net
          Priority: optional
          Architecture: all
          Maintainer: Storm Projects
          Depends: python3, python3-flask, python3-requests, python3-waitress, python3-gi, gir1.2-gtk-3.0, gir1.2-webkit2-4.1, rclone, fuse3, ca-certificates
          Description: Rclone Manager Desktop for ZorinOS
           Google Drive multi-account manager, Media Pool, OneDrive/link importer, backup/restore and Drive Link API.
          CONTROL
          cat > "$PKG/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          chmod +x /opt/rclone-manager-desktop/desktop_main.py || true
          update-desktop-database /usr/share/applications >/dev/null 2>&1 || true
          exit 0
          POSTINST
          cat > "$PKG/DEBIAN/prerm" <<'PRERM'
          #!/bin/sh
          pkill -f '/opt/rclone-manager-desktop/desktop_main.py' 2>/dev/null || true
          exit 0
          PRERM
          chmod 755 "$PKG/DEBIAN/postinst" "$PKG/DEBIAN/prerm"
          dpkg-deb --build --root-owner-group "$PKG" "$DEB"

          unzip -t "dist-unified/rclone-manager-unraid-v${UNRAID}.zip" >/dev/null
          unzip -t "dist-unified/rclone-manager-desktop-zorinos-v${ZORIN}.zip" >/dev/null
          unzip -t "dist-unified/rclone-manager-vps-v${VPS}.zip" >/dev/null
          unzip -t "dist-unified/rclone-manager-drive-link-copier-v${EXT}.zip" >/dev/null
          tar -tzf "dist-unified/rclone-manager-vps-v${VPS}.tar.gz" >/dev/null
          dpkg-deb --info "dist-unified/rclone-manager-desktop-zorinos_${ZORIN}_all.deb" >/dev/null

          (
            cd dist-unified
            sha256sum \
              "rclone-manager-unraid-v${UNRAID}.zip" \
              "rclone-manager-desktop-zorinos-v${ZORIN}.zip" \
              "rclone-manager-desktop-zorinos_${ZORIN}_all.deb" \
              "rclone-manager-vps-v${VPS}.zip" \
              "rclone-manager-vps-v${VPS}.tar.gz" \
              "rclone-manager-drive-link-copier-v${EXT}.zip" \
              > SHA256SUMS.txt
          )
          cat dist-unified/SHA256SUMS.txt

      - name: Publish unified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(tr -d '[:space:]' < release-bundle/VERSION)"
          UNRAID="$(tr -d '[:space:]' < unraid-release/VERSION)"
          ZORIN="$(tr -d '[:space:]' < desktop-release/VERSION)"
          VPS="$(tr -d '[:space:]' < vps-release/VERSION)"
          EXT="$(tr -d '[:space:]' < extension-release/VERSION)"
          TAG="rclone-manager-v${BUNDLE}"
          TITLE="Rclone Manager v${BUNDLE} — Media Pool + Google Advanced"
          NOTES="docs/RELEASE-RCLONE-MANAGER-${BUNDLE}.md"
          ASSETS=(
            "dist-unified/rclone-manager-unraid-v${UNRAID}.zip"
            "dist-unified/rclone-manager-desktop-zorinos-v${ZORIN}.zip"
            "dist-unified/rclone-manager-desktop-zorinos_${ZORIN}_all.deb"
            "dist-unified/rclone-manager-vps-v${VPS}.zip"
            "dist-unified/rclone-manager-vps-v${VPS}.tar.gz"
            "dist-unified/rclone-manager-drive-link-copier-v${EXT}.zip"
            "dist-unified/SHA256SUMS.txt"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" --target "${GITHUB_SHA}" --title "$TITLE" --notes-file "$NOTES" --latest
          fi

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(tr -d '[:space:]' < release-bundle/VERSION)"
          UNRAID="$(tr -d '[:space:]' < unraid-release/VERSION)"
          ZORIN="$(tr -d '[:space:]' < desktop-release/VERSION)"
          VPS="$(tr -d '[:space:]' < vps-release/VERSION)"
          EXT="$(tr -d '[:space:]' < extension-release/VERSION)"
          TAG="rclone-manager-v${BUNDLE}"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/release-assets.txt
          for NAME in \
            "rclone-manager-unraid-v${UNRAID}.zip" \
            "rclone-manager-desktop-zorinos-v${ZORIN}.zip" \
            "rclone-manager-desktop-zorinos_${ZORIN}_all.deb" \
            "rclone-manager-vps-v${VPS}.zip" \
            "rclone-manager-vps-v${VPS}.tar.gz" \
            "rclone-manager-drive-link-copier-v${EXT}.zip" \
            "SHA256SUMS.txt"; do
            grep -Fx "$NAME" /tmp/release-assets.txt >/dev/null || { echo "Missing release asset: $NAME" >&2; exit 1; }
          done
          echo "Release $TAG verified with all expected assets."
