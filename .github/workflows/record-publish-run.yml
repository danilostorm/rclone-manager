name: Record publish workflow result

on:
  workflow_run:
    workflows: ['Publish unified Rclone Manager release']
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record publish result
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p release-bundle
          {
            echo "status=${CONCLUSION}"
            echo "run_id=${RUN_ID}"
            echo "run_number=${RUN_NUMBER}"
            echo "head_sha=${HEAD_SHA}"
            echo "workflow_url=${HTML_URL}"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release-bundle/PUBLISH-RUN-1.9.0.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-bundle/PUBLISH-RUN-1.9.0.txt
          git commit -m "ci: record 1.9.0 publish run ${RUN_ID} (${CONCLUSION})"
          git push origin HEAD:main
