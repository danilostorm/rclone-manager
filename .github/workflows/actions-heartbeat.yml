name: Actions heartbeat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-heartbeat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record heartbeat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          {
            echo 'status=github-actions-ok'
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_id=${GITHUB_RUN_ID}"
          } > release-bundle/ACTIONS-HEARTBEAT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-bundle/ACTIONS-HEARTBEAT.txt
          git commit -m 'ci: record actions heartbeat'
          git push origin HEAD:main
