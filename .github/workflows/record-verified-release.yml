name: Record verified Rclone Manager 1.9.0 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-verified-release.yml'
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for release and verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='rclone-manager-v1.9.0'

          FOUND=0
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/tmp/release-view.txt 2>&1; then
              FOUND=1
              break
            fi
            echo "Waiting for $TAG ($i/60)..."
            sleep 10
          done
          test "$FOUND" = 1 || { cat /tmp/release-view.txt; exit 1; }

          gh release view "$TAG" --json tagName,name,url,assets > /tmp/release.json
          jq -r '.assets[].name' /tmp/release.json | sort > /tmp/assets.txt

          EXPECTED=(
            'rclone-manager-unraid-v1.9.0.zip'
            'rclone-manager-desktop-zorinos-v1.5.0.zip'
            'rclone-manager-desktop-zorinos_1.5.0_all.deb'
            'rclone-manager-vps-v1.2.0.zip'
            'rclone-manager-vps-v1.2.0.tar.gz'
            'rclone-manager-drive-link-copier-v1.3.0.zip'
            'SHA256SUMS.txt'
          )

          for asset in "${EXPECTED[@]}"; do
            grep -Fxq "$asset" /tmp/assets.txt || { echo "Missing release asset: $asset" >&2; exit 1; }
          done

          mkdir -p release-bundle
          {
            echo 'status=verified'
            echo "tag=$TAG"
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "release_url=$(jq -r '.url' /tmp/release.json)"
            echo 'assets:'
            cat /tmp/assets.txt
          } > release-bundle/PUBLISHED-1.9.0.txt

      - name: Commit verification marker
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- release-bundle/PUBLISHED-1.9.0.txt && git ls-files --error-unmatch release-bundle/PUBLISHED-1.9.0.txt >/dev/null 2>&1; then
            echo 'Verification marker already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-bundle/PUBLISHED-1.9.0.txt
          git commit -m 'release: record verified 1.9.0 publication'
          git push origin HEAD:main
