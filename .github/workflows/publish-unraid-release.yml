name: Publish Unraid release

on:
  push:
    branches: [main]
    paths:
      - 'unraid-release/VERSION'
      - 'unraid-release/patches/**'
      - 'unraid-release/full/**'
      - 'docs/RELEASE-UNRAID-*.md'
      - '.github/workflows/publish-unraid-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < unraid-release/VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=unraid-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rebuild release source
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          BASE='1.6.9'
          BASE_PREFIX="unraid-release/full/${BASE}.tar.xz.b64.part-"
          PATCH="unraid-release/patches/${VERSION}.patch.xz.b64"
          test -e "${BASE_PREFIX}00"
          test -f "$PATCH"
          rm -rf build-unraid
          mkdir -p build-unraid dist/unraid
          cat "${BASE_PREFIX}"* | base64 -d > /tmp/base-unraid.tar.xz
          tar -xJf /tmp/base-unraid.tar.xz -C build-unraid
          base64 -d "$PATCH" | xz -d > /tmp/update.patch
          patch -d build-unraid -p1 < /tmp/update.patch
          test "$(tr -d '[:space:]' < build-unraid/VERSION)" = "$VERSION"
          if find build-unraid -type f \( -name '.env' -o -name 'rclone.conf' -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.pem' -o -name '*.key' \) | grep -q .; then
            echo 'Sensitive runtime file found.' >&2; exit 1
          fi
          if find build-unraid -type d -name '__pycache__' | grep -q .; then
            echo '__pycache__ must not be shipped.' >&2; exit 1
          fi
          ZIP="dist/unraid/rclone-manager-unraid-v${VERSION}.zip"
          rm -f "$ZIP" "dist/unraid/rclone-manager-unraid-v${VERSION}.sha256"
          (cd build-unraid && zip -qr "$GITHUB_WORKSPACE/$ZIP" .)
          (cd dist/unraid && sha256sum "rclone-manager-unraid-v${VERSION}.zip" > "rclone-manager-unraid-v${VERSION}.sha256")

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          TAG='${{ steps.version.outputs.tag }}'
          ZIP="dist/unraid/rclone-manager-unraid-v${VERSION}.zip"
          SHA="dist/unraid/rclone-manager-unraid-v${VERSION}.sha256"
          NOTES="docs/RELEASE-UNRAID-${VERSION}.md"
          TITLE="Rclone Manager for Unraid v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$ZIP" "$SHA" --title "$TITLE" --notes-file "$NOTES"
          fi
