name: Publish Unraid release

on:
  push:
    branches: [main]
    paths:
      - 'unraid-release/VERSION'
      - 'unraid-release/patches/**'
      - 'dist/unraid/**'
      - 'docs/RELEASE-UNRAID-*.md'
      - '.github/workflows/publish-unraid-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < unraid-release/VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=unraid-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          BASE_VERSION='1.4.0'
          BASE_ZIP="dist/unraid/rclone-manager-unraid-v${BASE_VERSION}.zip"
          ZIP="dist/unraid/rclone-manager-unraid-v${VERSION}.zip"
          PATCH="unraid-release/patches/${VERSION}.patch"
          PATCH_TMP="/tmp/rclone-manager-unraid-${VERSION}.patch"

          test -f "$BASE_ZIP"
          if [ -f "$PATCH" ]; then
            cp "$PATCH" "$PATCH_TMP"
          else
            PARTS=("${PATCH}.part-"*)
            test -e "${PARTS[0]}"
            cat "${PATCH}.part-"* > "$PATCH_TMP"
          fi

          rm -rf build-unraid
          mkdir -p build-unraid
          unzip -q "$BASE_ZIP" -d build-unraid
          (
            cd build-unraid
            patch -p1 < "$PATCH_TMP"
          )

          if find build-unraid -type f \( -name '.env' -o -name 'rclone.conf' -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.pem' -o -name '*.key' \) | grep -q .; then
            echo 'Sensitive runtime file found in Unraid release source.' >&2
            exit 1
          fi
          if find build-unraid -type d -name '__pycache__' | grep -q .; then
            echo '__pycache__ must not be shipped.' >&2
            exit 1
          fi

          rm -f "$ZIP" "${ZIP%.zip}.sha256"
          (
            cd build-unraid
            zip -qr "$GITHUB_WORKSPACE/$ZIP" .
          )
          (
            cd dist/unraid
            sha256sum "rclone-manager-unraid-v${VERSION}.zip" > "rclone-manager-unraid-v${VERSION}.sha256"
          )

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          TAG='${{ steps.version.outputs.tag }}'
          ZIP="dist/unraid/rclone-manager-unraid-v${VERSION}.zip"
          SHA="dist/unraid/rclone-manager-unraid-v${VERSION}.sha256"
          TITLE="Rclone Manager for Unraid v${VERSION}"
          NOTES="docs/RELEASE-UNRAID-${VERSION}.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
            fi
          else
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" "$ZIP" "$SHA" --title "$TITLE" --notes-file "$NOTES"
            else
              gh release create "$TAG" "$ZIP" "$SHA" --title "$TITLE" --notes "Rclone Manager ${VERSION} para Unraid. Preserve .env, data/ e cache/ ao atualizar e execute ./update.sh."
            fi
          fi
