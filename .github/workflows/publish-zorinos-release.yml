name: Publish ZorinOS release

on:
  push:
    branches: [main]
    paths:
      - 'desktop-release/VERSION'
      - 'desktop-release/patches/**'
      - 'unraid-release/patches/**'
      - 'unraid-release/full/**'
      - 'docs/RELEASE-*.md'
      - '.github/workflows/publish-zorinos-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < desktop-release/VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=zorinos-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rebuild validated source
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          BASE_PREFIX='unraid-release/full/1.6.9.tar.xz.b64.part-'
          U_PATCH='unraid-release/patches/1.7.0.patch.xz.b64'
          D_PREFIX="desktop-release/patches/from-unraid-1.7.0-to-${VERSION}.patch.xz.b64.part-"
          test -e "${BASE_PREFIX}00"
          test -f "$U_PATCH"
          test -e "${D_PREFIX}00"
          rm -rf build-base build-src package
          mkdir -p build-base build-src dist/zorinos
          cat "${BASE_PREFIX}"* | base64 -d > /tmp/base-unraid.tar.xz
          tar -xJf /tmp/base-unraid.tar.xz -C build-base
          base64 -d "$U_PATCH" | xz -d > /tmp/unraid.patch
          patch -d build-base -p1 < /tmp/unraid.patch
          SRC="build-src/rclone-manager-desktop-v${VERSION}"
          cp -a build-base "$SRC"
          cat "${D_PREFIX}"* | base64 -d | xz -d > /tmp/desktop.patch
          patch -d "$SRC" -p1 < /tmp/desktop.patch
          test "$(tr -d '[:space:]' < "$SRC/VERSION")" = "$VERSION"
          if find "$SRC" -type f \( -name '.env' -o -name 'rclone.conf' -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.pem' -o -name '*.key' \) | grep -q .; then
            echo 'Sensitive runtime file found.' >&2; exit 1
          fi
          if find "$SRC" -type d -name '__pycache__' | grep -q .; then
            echo '__pycache__ must not be shipped.' >&2; exit 1
          fi
          ZIP="dist/zorinos/rclone-manager-desktop-zorinos-v${VERSION}.zip"
          rm -f "$ZIP" "${ZIP%.zip}.sha256"
          (cd build-src && zip -qr "$GITHUB_WORKSPACE/$ZIP" "rclone-manager-desktop-v${VERSION}")
          (cd dist/zorinos && sha256sum "rclone-manager-desktop-zorinos-v${VERSION}.zip" > "rclone-manager-desktop-zorinos-v${VERSION}.sha256")

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          SRC="build-src/rclone-manager-desktop-v${VERSION}"
          PKG=package
          DEB="dist/zorinos/rclone-manager-desktop-zorinos_${VERSION}_all.deb"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/rclone-manager-desktop" "$PKG/usr/bin" "$PKG/usr/share/applications"
          cp -a "$SRC"/. "$PKG/opt/rclone-manager-desktop/"
          cp "$SRC/packaging/rclone-manager-desktop" "$PKG/usr/bin/rclone-manager-desktop"
          cp "$SRC/packaging/rclone-manager-desktop.desktop" "$PKG/usr/share/applications/rclone-manager-desktop.desktop"
          chmod +x "$PKG/usr/bin/rclone-manager-desktop" "$PKG/opt/rclone-manager-desktop/desktop_main.py" "$PKG/opt/rclone-manager-desktop/install-zorin.sh" "$PKG/opt/rclone-manager-desktop/uninstall-zorin.sh"
          cat > "$PKG/DEBIAN/control" <<CONTROL
          Package: rclone-manager-desktop
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: all
          Maintainer: Storm Projects
          Depends: python3, python3-flask, python3-requests, python3-waitress, python3-gi, gir1.2-gtk-3.0, gir1.2-webkit2-4.1, rclone, fuse3, ca-certificates
          Description: Rclone Manager Desktop for ZorinOS
           Google Drive multi-account manager, OneDrive importer, portable backup/restore and GTK/WebKit UI.
          CONTROL
          cat > "$PKG/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          chmod +x /opt/rclone-manager-desktop/desktop_main.py || true
          update-desktop-database /usr/share/applications >/dev/null 2>&1 || true
          exit 0
          POSTINST
          cat > "$PKG/DEBIAN/prerm" <<'PRERM'
          #!/bin/sh
          pkill -f '/opt/rclone-manager-desktop/desktop_main.py' 2>/dev/null || true
          exit 0
          PRERM
          chmod 755 "$PKG/DEBIAN/postinst" "$PKG/DEBIAN/prerm"
          dpkg-deb --build --root-owner-group "$PKG" "$DEB"
          (cd dist/zorinos && sha256sum "rclone-manager-desktop-zorinos_${VERSION}_all.deb" > "rclone-manager-desktop-zorinos_${VERSION}_all.deb.sha256")

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          TAG='${{ steps.version.outputs.tag }}'
          ZIP="dist/zorinos/rclone-manager-desktop-zorinos-v${VERSION}.zip"
          DEB="dist/zorinos/rclone-manager-desktop-zorinos_${VERSION}_all.deb"
          NOTES="docs/RELEASE-${VERSION}.md"
          TITLE="Rclone Manager Desktop for ZorinOS v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" "${DEB}.sha256" "$ZIP" "${ZIP%.zip}.sha256" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$DEB" "${DEB}.sha256" "$ZIP" "${ZIP%.zip}.sha256" --title "$TITLE" --notes-file "$NOTES"
          fi
