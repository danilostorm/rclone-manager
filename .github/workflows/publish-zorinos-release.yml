name: Publish ZorinOS release

on:
  push:
    branches: [main]
    paths:
      - 'desktop-release/VERSION'
      - 'dist/zorinos/**'
      - 'docs/RELEASE-*.md'
      - '.github/workflows/publish-zorinos-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < desktop-release/VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=zorinos-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          ZIP="dist/zorinos/rclone-manager-desktop-zorinos-v${VERSION}.zip"
          B64="${ZIP}.base64"

          # The repository may store a release source as base64 text so that
          # publishing does not depend on committing opaque binary blobs.
          if [ ! -f "$ZIP" ] && [ -f "$B64" ]; then
            base64 --decode "$B64" > "$ZIP"
          fi

          test -f "$ZIP"
          (
            cd dist/zorinos
            sha256sum -c "rclone-manager-desktop-zorinos-v${VERSION}.sha256"
          )
          rm -rf build-src package
          mkdir -p build-src
          unzip -q "$ZIP" -d build-src

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          SRC="build-src/rclone-manager-desktop-v${VERSION}"
          PKG="package"
          DEB="dist/zorinos/rclone-manager-desktop-zorinos_${VERSION}_all.deb"

          test -d "$SRC"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/rclone-manager-desktop" "$PKG/usr/bin" "$PKG/usr/share/applications"
          cp -a "$SRC"/. "$PKG/opt/rclone-manager-desktop/"
          cp "$SRC/packaging/rclone-manager-desktop" "$PKG/usr/bin/rclone-manager-desktop"
          cp "$SRC/packaging/rclone-manager-desktop.desktop" "$PKG/usr/share/applications/rclone-manager-desktop.desktop"
          chmod +x "$PKG/usr/bin/rclone-manager-desktop" "$PKG/opt/rclone-manager-desktop/desktop_main.py" "$PKG/opt/rclone-manager-desktop/install-zorin.sh" "$PKG/opt/rclone-manager-desktop/uninstall-zorin.sh"

          cat > "$PKG/DEBIAN/control" <<CONTROL
          Package: rclone-manager-desktop
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: all
          Maintainer: Storm Projects
          Depends: python3, python3-flask, python3-requests, python3-waitress, python3-gi, gir1.2-gtk-3.0, gir1.2-webkit2-4.1, rclone, fuse3, ca-certificates
          Description: Rclone Manager Desktop for ZorinOS
           Google Drive multi-account mounts, transfers, Shared with me browser,
           checkpoints, quota estimation, backup/restore and local GTK/WebKit UI.
          CONTROL

          cat > "$PKG/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          chmod +x /opt/rclone-manager-desktop/desktop_main.py || true
          update-desktop-database /usr/share/applications >/dev/null 2>&1 || true
          exit 0
          POSTINST

          cat > "$PKG/DEBIAN/prerm" <<'PRERM'
          #!/bin/sh
          pkill -f '/opt/rclone-manager-desktop/desktop_main.py' 2>/dev/null || true
          exit 0
          PRERM

          chmod 755 "$PKG/DEBIAN/postinst" "$PKG/DEBIAN/prerm"
          dpkg-deb --build --root-owner-group "$PKG" "$DEB"
          (
            cd dist/zorinos
            sha256sum "rclone-manager-desktop-zorinos_${VERSION}_all.deb" > "rclone-manager-desktop-zorinos_${VERSION}_all.deb.sha256"
          )

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          TAG='${{ steps.version.outputs.tag }}'
          ZIP="dist/zorinos/rclone-manager-desktop-zorinos-v${VERSION}.zip"
          DEB="dist/zorinos/rclone-manager-desktop-zorinos_${VERSION}_all.deb"
          TITLE="Rclone Manager Desktop for ZorinOS v${VERSION}"
          NOTES="docs/RELEASE-${VERSION}.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" "${DEB}.sha256" "$ZIP" "${ZIP}.sha256" --clobber
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
            fi
          else
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" "$DEB" "${DEB}.sha256" "$ZIP" "${ZIP}.sha256" --title "$TITLE" --notes-file "$NOTES"
            else
              gh release create "$TAG" "$DEB" "${DEB}.sha256" "$ZIP" "${ZIP}.sha256" \
                --title "$TITLE" \
                --notes "Rclone Manager Desktop ${VERSION} para ZorinOS/Ubuntu. Instale com: sudo apt install ./rclone-manager-desktop-zorinos_${VERSION}_all.deb"
            fi
          fi
