name: Verify unified release

on:
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify current stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='rclone-manager-v1.9.0'
          EXPECTED=(
            'rclone-manager-unraid-v1.9.0.zip'
            'rclone-manager-desktop-zorinos-v1.5.0.zip'
            'rclone-manager-desktop-zorinos_1.5.0_all.deb'
            'rclone-manager-vps-v1.2.0.zip'
            'rclone-manager-vps-v1.2.0.tar.gz'
            'rclone-manager-drive-link-copier-v1.3.0.zip'
            'SHA256SUMS.txt'
          )
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/assets.txt
          for asset in "${EXPECTED[@]}"; do
            grep -Fxq "$asset" /tmp/assets.txt || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          echo "$TAG contains every expected asset."
